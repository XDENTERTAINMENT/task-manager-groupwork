<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal-Task-Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>

   <header> 
    <h1>Task Manager</h1>
    <p>what will i achieve today</p>
   </header>
    <!-- the main -->
   <main>
    <section class="section1">
        <div>
        <p id="total-task"> <i class="fa-regular fa-calendar"></i>6</p>
        </div> 

        <div>
        <p id="pending-task"> div <i class="fa-regular fa-clock"></i>4</p>
        </div> 

        <div>
        <p  id="completed-task">2</p>
        </div> 
    </section>



    <!-- section 2 -->
    <section  class="section2">

        <!-- the create task section -->
      <div class="create-task">
          <div> <p>create a task</p></div>
       <form action="submit">

           <label for="title">
             Task Title
            <input type="text"  id="title-input">
           </label>


           <label for="description">
                   description
            <input type="text"  id="description-input">
           </label>

           <label for="priority">

            priority
             <select name="" id="">
                <option value="">choose a priority</option>
                <option value=""> High</option>
                <option value=""> Medium</option>
                <option value="">  low</option>
             </select>  >
            >
           </label>

           <label for="date">
            Due date
            <input type="date">
           </label>

     <button class="form-button"> save task</button>
       </form>
    <div>


        
       
      <!-- task mapping -->

        <div class="task-mapping">
              <h3> your task (6)</h3>
        <p> your saved task all in one place</p>
        <input type="search">


        <!-- the card -->
         <div class="card">
            <input type="checkbox">
            <div>

                <h3> build the task</h3>
                <p>title and priority</p>
                <p id="priority"> high</p></div>
                <p> date</p>

            
         </div>
<!-- the inline editing -->
         <div>
            <button>update</button>
            <button  class="save"> save</button>
            <button class="delete"> delete</button>
           
         </div>

        </div>



</div>

    </section>
   </main>

   <!-- the footer -->
   <footer>
    all right reserved
   </footer>
</body>
</html>
